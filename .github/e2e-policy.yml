version: 1
repo: osac-project/osac-ci-rehearsal
path_filters:
  mode: enforce
  file: filters/ci-filters.yml
jobs:
  e2e-alpha:
    kind: e2e
    check: "E2E / Alpha Stub"
    suite: alpha
    workflow: e2e-alpha.yml  # a run of its own, started by the decision
    filters_any: [e2e-code]
  # A second box for alpha: the same suite and line, asked for its full tier.
  e2e-alpha-full:
    kind: e2e
    check: "E2E / Alpha Stub"
    suite: alpha-full
    manual_only: true
    variant_of: alpha
    tier: full
    label: "Alpha Stub · full"
  e2e-beta:
    kind: e2e
    check: "E2E / Beta Stub"
    suite: beta
    filters: [beta-touched]
    filters_any: [e2e-code]
  e2e-gamma:
    kind: e2e
    check: "E2E / Gamma Stub"
    suite: gamma
    manual_only: true
  # The cheap jobs: started by the controller as runs of their own when a pull request opens or gets a commit; their lines
  # are the app's, and the app adds them up into the required CI check.
  lint:
    kind: cheap
    check: "CI / lint"
    workflow: ci-lint.yml
  unit:
    kind: cheap
    check: "CI / unit"
    workflow: ci-unit.yml
  integration:
    kind: cheap
    check: "CI / integration"
    workflow: ci-integration.yml
