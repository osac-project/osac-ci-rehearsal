---
name: E2E Beta Stub
on:
  workflow_call:
    inputs:
      repo: {type: string, required: true}
      sha: {type: string, required: true}
      pr-number: {type: string, default: ""}
      fork-pr-author: {type: string, default: ""}
      fork-pr-author-association: {type: string, default: ""}
permissions:
  contents: read
  statuses: read  # beta/fail-once reads the earlier lines of this suite (commit statuses...
  checks: read  # ...or check runs of the app, whichever kind of line the repository writes)
jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - env:
          AUTHOR: ${{ inputs.fork-pr-author }}
          ASSOC: ${{ inputs.fork-pr-author-association }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          REPO: ${{ inputs.repo }}
          PR: ${{ inputs.pr-number }}
        run: |
          printf "the stub suite beta runs for %s of %s (PR %s); fork author='%s' association='%s'\n" "${SHA}" "${REPO}" "${PR}" "${AUTHOR}" "${ASSOC}"
          if [ "${EVENT}" = merge_group ] && [ -e beta/queue-fail ]; then sleep 15; echo "beta/queue-fail exists: the stub fails in the merge queue only"; exit 1; fi
          sleep 40
          if [ "beta" = beta ] && [ -e beta/fail ]; then echo "beta/fail exists: the stub suite fails on purpose"; exit 1; fi
          # beta/fail-once: fails the first time on a commit and passes when run again (it looks for an earlier failure of its line)
          if [ -e beta/fail-once ]; then
            by_status=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/statuses" --jq '[.[] | select(.context == "E2E / Beta Stub" and .state == "failure")] | length' || echo 0)
            by_check=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" --jq '[.check_runs[] | select(.name == "E2E / Beta Stub" and .conclusion == "failure")] | length' || echo 0)
            earlier=$((by_status + by_check))
            if [ "${earlier}" = 0 ]; then echo "beta/fail-once exists and beta has not failed on this commit yet: the stub fails"; exit 1; fi
            echo "beta failed on this commit before: the stub passes this time"
          fi
