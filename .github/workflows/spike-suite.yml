---
# SPIKE (delete after): a suite started as a run of its own with workflow_dispatch.
name: Spike suite
run-name: "Spike suite · ${{ inputs.suite }} · pr ${{ inputs.pr-number }} · ${{ inputs.sha }}"
on:
  workflow_dispatch:
    inputs:
      suite: {type: string, required: true}
      sha: {type: string, required: true}
      pr-number: {type: string, default: ""}
      sleep: {type: string, default: "25"}
permissions: {}
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUITE: ${{ inputs.suite }}
          SHA: ${{ inputs.sha }}
          SLEEP: ${{ inputs.sleep }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          printf 'suite=%s sha=%s event=%s actor=%s attempt=%s\n' "$SUITE" "$SHA" "$EVENT" "$ACTOR" "$ATTEMPT"
          sleep "$SLEEP"
