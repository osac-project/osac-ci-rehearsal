---
# Autopilot: the one entry point of the pull request flow (osac-ci docs/CALLERS.md). Every event of a pull request ends
# here, and the controller (osac-ci, as the OSAC CI app) decides what to do:
#   * a pull request opens, gets a commit, closes, is queued, or auto-merge changes (pull_request_target): its cheap jobs are
#     started as runs of their own (start), and the control comment is written or refreshed (comment);
#   * a cheap job or an E2E suite that ran as a run of its own ends, a review is relayed, a comment or a box of the control
#     comment asks for suites, or a person starts it by hand (workflow_run, issue_comment, workflow_dispatch): the decision
#     (decide) says what the E2E does, the suites run, and their result is added up (track, suites, finish).
# It runs from the default branch with the repository's token and checks out nothing of the pull request.
name: Autopilot
# The title is for people: the decision does not read it (it finds the run of an older commit by that commit's E2E line).
run-name: >-
  ${{ github.event_name == 'pull_request_target' && format('Autopilot #{0} ({1}) · {2}', github.event.pull_request.number, github.event.action, github.event.pull_request.head.ref) ||
  github.event_name == 'workflow_dispatch' && format('E2E #{0} (started by hand)', inputs.number) ||
  github.event_name == 'issue_comment' && format('E2E #{0} (suites asked for in a comment)', github.event.issue.number) ||
  github.event.workflow_run.pull_requests[0].number && format('E2E #{0} · {1}',
  github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.head_branch) ||
  format('E2E · {0}:{1}', github.event.workflow_run.head_repository.owner.login, github.event.workflow_run.head_branch) }}

on:  # zizmor: ignore[dangerous-triggers] -- no pull request code is checked out; the suites run the approved commit
  pull_request_target:
    types: [opened, reopened, synchronize, closed, enqueued, dequeued, auto_merge_enabled, auto_merge_disabled]
  workflow_run:
    workflows: ["CI Lint", "CI Unit", "CI Integration", "E2E review relay", "E2E Alpha Stub"]  # runs of their own
    types: [requested, completed]
    # The CI run of a merge queue entry is on a branch GitHub names gh-readonly-queue/...: it is no pull request, the
    # decision ignores it, and it only added a run with a long title for every entry.
    branches-ignore: ["gh-readonly-queue/**"]
  issue_comment:
    types: [edited, created]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number
        required: true

permissions: {}

jobs:
  # a pull request opened, was reopened or got a commit: start its cheap jobs as runs of their own
  start:
    if: github.event_name == 'pull_request_target' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize')
    uses: osac-project/osac-ci/.github/workflows/cheap-start.yml@fbb5510199a143d1c7e61e59182fe1fb16e32771  # osac-ci branch autopilot-cheap-stage (unreleased)
    permissions:
      contents: read  # the policy of the default branch
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  # the control comment of the pull request: written the moment it opens, refreshed when the queue or auto-merge changes
  comment:
    if: github.event_name == 'pull_request_target'
    uses: osac-project/osac-ci/.github/workflows/e2e-pr-comment.yml@fbb5510199a143d1c7e61e59182fe1fb16e32771  # osac-ci branch autopilot-cheap-stage (unreleased)
    permissions: {}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  decide:
    if: github.event_name != 'pull_request_target'
    uses: osac-project/osac-ci/.github/workflows/e2e-pr-decide.yml@fbb5510199a143d1c7e61e59182fe1fb16e32771  # osac-ci branch autopilot-cheap-stage (unreleased)
    with:
      lines-kind: statuses
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: write
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  track:
    needs: decide
    if: github.event_name != 'pull_request_target' && (needs.decide.outputs.start == 'true')
    uses: osac-project/osac-ci/.github/workflows/e2e-pr-track.yml@fbb5510199a143d1c7e61e59182fe1fb16e32771  # osac-ci branch autopilot-cheap-stage (unreleased)
    permissions:
      contents: read
    with:
      lines-kind: statuses
      sha: ${{ needs.decide.outputs.sha }}
      suite-checks: ${{ needs.decide.outputs.suite-checks }}
      dispatched-runs: ${{ needs.decide.outputs.dispatched-runs }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  beta:
    needs: decide
    if: github.event_name != 'pull_request_target' && (needs.decide.outputs.start == 'true' && contains(needs.decide.outputs.suites, '"beta"'))
    permissions:
      contents: read
      statuses: read  # the beta stub reads the earlier lines of its suite (a called job cannot have more than its caller gives)
    uses: ./.github/workflows/e2e-beta.yml
    with:
      repo: ${{ needs.decide.outputs.head-repo }}
      sha: ${{ needs.decide.outputs.sha }}
      pr-number: ${{ needs.decide.outputs.number }}
      fork-pr-author: ${{ needs.decide.outputs.fork-author }}
      fork-pr-author-association: ${{ needs.decide.outputs.fork-association }}

  gamma:
    needs: decide
    if: github.event_name != 'pull_request_target' && (needs.decide.outputs.start == 'true' && contains(needs.decide.outputs.suites, '"gamma"'))
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-gamma.yml
    with:
      repo: ${{ needs.decide.outputs.head-repo }}
      sha: ${{ needs.decide.outputs.sha }}
      pr-number: ${{ needs.decide.outputs.number }}
      fork-pr-author: ${{ needs.decide.outputs.fork-author }}
      fork-pr-author-association: ${{ needs.decide.outputs.fork-association }}

  finish:
    needs: [decide, track, beta, gamma]
    if: github.event_name != 'pull_request_target' && (always() && needs.decide.outputs.start == 'true')
    uses: osac-project/osac-ci/.github/workflows/e2e-pr-finish.yml@fbb5510199a143d1c7e61e59182fe1fb16e32771  # osac-ci branch autopilot-cheap-stage (unreleased)
    permissions:
      contents: read
      pull-requests: write
    with:
      lines-kind: statuses
      sha: ${{ needs.decide.outputs.sha }}
      suites: ${{ needs.decide.outputs.suites }}
      suite-checks: ${{ needs.decide.outputs.suite-checks }}
      dispatched: ${{ needs.decide.outputs.dispatched }}
      all-suite-checks: ${{ needs.decide.outputs.all-suite-checks }}
      number: ${{ needs.decide.outputs.number }}
      manual: ${{ needs.decide.outputs.manual }}
      selected-checks: ${{ needs.decide.outputs.selected-checks }}
      results: ${{ toJSON(needs) }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
