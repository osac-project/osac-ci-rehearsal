---
# Autopilot: the one entry point of the pull request flow (osac-ci docs/CALLERS.md). Every event of a pull request ends
# here, and the controller (osac-ci, as the OSAC CI app) decides what to do:
#   * a pull request opens, gets a commit, closes, is queued, or auto-merge changes (pull_request_target): its cheap jobs are
#     started as runs of their own (start), and the control comment is written or refreshed (comment);
#   * a cheap job or an E2E suite that ran as a run of its own ends, a review is relayed, a comment or a box of the control
#     comment asks for suites, or a person starts it by hand (workflow_run, issue_comment, workflow_dispatch): the decision
#     (decide) says what the E2E does, the suites run, and their result is added up (track, suites, finish).
# It runs from the default branch with the repository's token and checks out nothing of the pull request.
name: Autopilot
# The title is for people: the decision does not read it (it finds the run of an older commit by that commit's E2E line).
run-name: >-
  ${{ github.event_name == 'merge_group' && format('Queue entry · {0}', github.event.merge_group.head_ref) ||
  github.event_name == 'pull_request_target' && format('Autopilot #{0} ({1}) · {2}', github.event.pull_request.number, github.event.action, github.event.pull_request.head.ref) ||
  github.event_name == 'workflow_dispatch' && format('E2E #{0} (started by hand)', inputs.number) ||
  github.event_name == 'issue_comment' && format('E2E #{0} (suites asked for in a comment)', github.event.issue.number) ||
  github.event.workflow_run.pull_requests[0].number && format('E2E #{0} · {1}',
  github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.head_branch) ||
  format('E2E · {0}:{1}', github.event.workflow_run.head_repository.owner.login, github.event.workflow_run.head_branch) }}

on:  # zizmor: ignore[dangerous-triggers] -- no pull request code is checked out; the suites run the approved commit
  merge_group:  # a queue entry: the same jobs, inline, and the same CI Autopilot check on its commit
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, closed, enqueued, dequeued, auto_merge_enabled, auto_merge_disabled]
  workflow_run:
    workflows: ["Autopilot / CI / Lint", "Autopilot / CI / Unit", "Autopilot / CI / Integration", "E2E review relay", "Autopilot / E2E / Alpha Stub"]  # runs of their own
    types: [requested, completed]
    # The CI run of a merge queue entry is on a branch GitHub names gh-readonly-queue/...: it is no pull request, the
    # decision ignores it, and it only added a run with a long title for every entry.
    branches-ignore: ["gh-readonly-queue/**"]
  issue_comment:
    types: [edited, created]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number
        required: true

permissions: {}

jobs:
  # The pull request events, in one job named for what it is (the row on the pull request while it runs; the finished run is
  # deleted by the next decision, and the app's own `CI Autopilot` check, with the same name and the app's icon, is what stays):
  # the control comment is written the moment a pull request opens (first, before the bots that post a few seconds later),
  # the cheap jobs are started as runs of their own, and the summary check says what was done.
  autopilot:
    name: CI Autopilot
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # the policy of the default branch
    steps:
      - name: Token of the OSAC CI app
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: "4966101"
          private-key: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
          permission-pull-requests: write  # the comment
          permission-members: read
          permission-issues: write  # and its edits
          permission-checks: write  # the CI and CI Autopilot checks
          permission-actions: write  # start the cheap jobs
          permission-statuses: write  # their lines
          permission-contents: read  # the CODEOWNERS of the base branch, for the code owners row
      - uses: osac-project/osac-ci/.github/actions/early-comment@705213249202203637ca2f0d57205963921a8f69  # osac-ci branch autopilot-cheap-stage (unreleased)
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          number: ${{ github.event.pull_request.number }}
          author: ${{ github.event.pull_request.user.login }}
          fresh: ${{ github.event.action == 'opened' }}
      - uses: osac-project/osac-ci/.github/actions/manual-status@705213249202203637ca2f0d57205963921a8f69  # osac-ci branch autopilot-cheap-stage (unreleased)
        if: github.event.action != 'opened' && github.event.action != 'reopened'
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          number: ${{ github.event.pull_request.number }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:  # the default branch (what a pull_request_target run checks out), never the pull request
          sparse-checkout: |
            .github/e2e-policy.yml
            .github/filters/ci-filters.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: osac-project/osac-ci/.github/actions/cheap-start@705213249202203637ca2f0d57205963921a8f69  # osac-ci branch autopilot-cheap-stage (unreleased)
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          number: ${{ github.event.pull_request.number }}
          policy-file: ${{ github.workspace }}/.github/e2e-policy.yml
          lines-kind: statuses
      - uses: osac-project/osac-ci/.github/actions/jira-reference@705213249202203637ca2f0d57205963921a8f69  # osac-ci branch autopilot-cheap-stage (unreleased)
        if: github.event.action != 'closed' && github.event.action != 'enqueued' && github.event.action != 'dequeued' && !startsWith(github.event.action, 'auto_merge')
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          number: ${{ github.event.pull_request.number }}
          policy-file: ${{ github.workspace }}/.github/e2e-policy.yml
          lines-kind: statuses
      - uses: osac-project/osac-ci/.github/actions/autopilot-summary@705213249202203637ca2f0d57205963921a8f69  # osac-ci branch autopilot-cheap-stage (unreleased)
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          number: ${{ github.event.pull_request.number }}
          policy-file: ${{ github.workspace }}/.github/e2e-policy.yml
          event: pull request ${{ github.event.action }}

  decide:
    name: Decide
    if: github.event_name != 'pull_request_target' && github.event_name != 'merge_group'
    uses: osac-project/osac-ci/.github/workflows/e2e-pr-decide.yml@705213249202203637ca2f0d57205963921a8f69  # osac-ci branch autopilot-cheap-stage (unreleased)
    with:
      lines-kind: statuses
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: write
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  track:
    name: E2E / track
    needs: decide
    if: github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && (needs.decide.outputs.start == 'true')
    uses: osac-project/osac-ci/.github/workflows/e2e-pr-track.yml@705213249202203637ca2f0d57205963921a8f69  # osac-ci branch autopilot-cheap-stage (unreleased)
    permissions:
      contents: read
    with:
      lines-kind: statuses
      sha: ${{ needs.decide.outputs.sha }}
      suite-checks: ${{ needs.decide.outputs.suite-checks }}
      dispatched-runs: ${{ needs.decide.outputs.dispatched-runs }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  beta:
    name: E2E / beta
    needs: decide
    if: github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && (needs.decide.outputs.start == 'true' && contains(needs.decide.outputs.suites, '"beta"'))
    permissions:
      contents: read
      statuses: read  # the beta stub reads the earlier lines of its suite (a called job cannot have more than its caller gives)
    uses: ./.github/workflows/e2e-beta.yml
    with:
      repo: ${{ needs.decide.outputs.head-repo }}
      sha: ${{ needs.decide.outputs.sha }}
      pr-number: ${{ needs.decide.outputs.number }}
      fork-pr-author: ${{ needs.decide.outputs.fork-author }}
      fork-pr-author-association: ${{ needs.decide.outputs.fork-association }}

  gamma:
    name: E2E / gamma
    needs: decide
    if: github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && (needs.decide.outputs.start == 'true' && contains(needs.decide.outputs.suites, '"gamma"'))
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-gamma.yml
    with:
      repo: ${{ needs.decide.outputs.head-repo }}
      sha: ${{ needs.decide.outputs.sha }}
      pr-number: ${{ needs.decide.outputs.number }}
      fork-pr-author: ${{ needs.decide.outputs.fork-author }}
      fork-pr-author-association: ${{ needs.decide.outputs.fork-association }}

  finish:
    name: E2E / finish
    needs: [decide, track, beta, gamma]
    if: github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && (always() && needs.decide.outputs.start == 'true')
    uses: osac-project/osac-ci/.github/workflows/e2e-pr-finish.yml@705213249202203637ca2f0d57205963921a8f69  # osac-ci branch autopilot-cheap-stage (unreleased)
    permissions:
      contents: read
      pull-requests: write
    with:
      lines-kind: statuses
      sha: ${{ needs.decide.outputs.sha }}
      suites: ${{ needs.decide.outputs.suites }}
      suite-checks: ${{ needs.decide.outputs.suite-checks }}
      dispatched: ${{ needs.decide.outputs.dispatched }}
      all-suite-checks: ${{ needs.decide.outputs.all-suite-checks }}
      number: ${{ needs.decide.outputs.number }}
      manual: ${{ needs.decide.outputs.manual }}
      selected-checks: ${{ needs.decide.outputs.selected-checks }}
      results: ${{ toJSON(needs) }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  # A merge queue entry (phase A: next to the old flow in ci.yml, jira-reference.yml and e2e-queue.yml): the plan lists the
  # cheap jobs and suites the entry needs, they run inline as jobs of this run, and one job writes the CI Autopilot check.
  queue-plan:
    name: Plan the queue entry
    if: github.event_name == 'merge_group'
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-plan.yml@705213249202203637ca2f0d57205963921a8f69  # osac-ci branch autopilot-cheap-stage (unreleased)
    permissions:
      contents: read
      actions: write

  queue-lint:
    name: lint
    needs: queue-plan
    if: contains(needs.queue-plan.outputs.cheap, '"lint"')
    permissions:
      contents: read
      pull-requests: read  # the nested verify job of the workflow asks for it (a pull request's inputs are checked; here it is skipped)
    uses: ./.github/workflows/ci-lint.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}

  queue-unit:
    name: unit
    needs: queue-plan
    if: contains(needs.queue-plan.outputs.cheap, '"unit"')
    permissions:
      contents: read
      pull-requests: read  # the nested verify job of the workflow asks for it (a pull request's inputs are checked; here it is skipped)
    uses: ./.github/workflows/ci-unit.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}

  queue-integration:
    name: integration
    needs: queue-plan
    if: contains(needs.queue-plan.outputs.cheap, '"integration"')
    permissions:
      contents: read
      pull-requests: read  # the nested verify job of the workflow asks for it (a pull request's inputs are checked; here it is skipped)
    uses: ./.github/workflows/ci-integration.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}

  queue-alpha:
    name: alpha
    needs: queue-plan
    if: contains(needs.queue-plan.outputs.suites, '"alpha"')
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-alpha.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}

  queue-beta:
    name: beta
    needs: queue-plan
    if: contains(needs.queue-plan.outputs.suites, '"beta"')
    permissions:
      contents: read
      statuses: read  # the beta stub reads the earlier lines of its suite (a called job cannot have more than its caller gives)
    uses: ./.github/workflows/e2e-beta.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}

  # One job that looks after the entry: opens the CI Autopilot check, watches the jobs and the other required checks of the
  # commit, writes the check at once on the first failure and stops everything that still runs (osac-ci docs/CALLERS.md).
  queue-result:
    name: Queue result
    needs: queue-plan
    if: always() && github.event_name == 'merge_group'
    uses: osac-project/osac-ci/.github/workflows/autopilot-queue-result.yml@705213249202203637ca2f0d57205963921a8f69  # osac-ci branch autopilot-cheap-stage (unreleased)
    permissions:
      actions: write
      contents: read
    with:
      sha: ${{ github.event.merge_group.head_sha }}
      branch: ${{ github.event.merge_group.base_ref }}
      plan-result: ${{ needs.queue-plan.result }}
      jobs: ${{ needs.queue-plan.outputs.jobs }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
