name: CI
on:
  pull_request:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  # A test job that fails in the merge queue only, when ci-queue-fail exists (to try stopping a queue entry for it).
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          sleep 10
          if [ "${EVENT}" = merge_group ] && [ -e ci-queue-fail ]; then echo "ci-queue-fail exists: the unit tests fail in the merge queue"; exit 1; fi
  # Like the CI job of osac: it runs whatever the parts did and fails when one failed (a skipped required check would
  # count as passed).
  CI:
    name: CI
    needs: unit-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          PARTS: ${{ needs.unit-tests.result }}
        run: |
          if [ "${PARTS}" != success ]; then echo "a part did not pass: ${PARTS}"; exit 1; fi
      - run: echo "the cheap checks of the rehearsal repository"
      - run: sleep 20
