---
name: E2E for pull requests
# The decision cancels the E2E of older commits by reading run titles: keep this exact format.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('E2E #{0} (started by hand)', inputs.number) ||
  format('E2E {0}:{1} @ {2}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch,
  github.event.workflow_run.head_sha) }}

on:  # zizmor: ignore[dangerous-triggers] -- no pull request code is checked out; the suites run the approved commit
  workflow_run:
    workflows: ["CI", "E2E review relay"]
    types: [requested, completed]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number
        required: true

permissions: {}

jobs:
  decide:
    uses: osac-project/osac-ci/.github/workflows/e2e-pr-decide.yml@c9463f6a0f6e00459160434041d38d6b7e5ae5df  # osac-ci main (PR 56)
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: write
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  track:
    needs: decide
    if: needs.decide.outputs.start == 'true'
    uses: osac-project/osac-ci/.github/workflows/e2e-pr-track.yml@c9463f6a0f6e00459160434041d38d6b7e5ae5df  # osac-ci main (PR 56)
    permissions:
      contents: read
    with:
      sha: ${{ needs.decide.outputs.sha }}
      suite-checks: ${{ needs.decide.outputs.suite-checks }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}

  alpha:
    needs: decide
    if: needs.decide.outputs.start == 'true' && contains(needs.decide.outputs.suites, '"alpha"')
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-alpha.yml
    with:
      repo: ${{ needs.decide.outputs.head-repo }}
      sha: ${{ needs.decide.outputs.sha }}
      pr-number: ${{ needs.decide.outputs.number }}
      fork-pr-author: ${{ needs.decide.outputs.fork-author }}
      fork-pr-author-association: ${{ needs.decide.outputs.fork-association }}

  beta:
    needs: decide
    if: needs.decide.outputs.start == 'true' && contains(needs.decide.outputs.suites, '"beta"')
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-beta.yml
    with:
      repo: ${{ needs.decide.outputs.head-repo }}
      sha: ${{ needs.decide.outputs.sha }}
      pr-number: ${{ needs.decide.outputs.number }}
      fork-pr-author: ${{ needs.decide.outputs.fork-author }}
      fork-pr-author-association: ${{ needs.decide.outputs.fork-association }}

  finish:
    needs: [decide, track, alpha, beta]
    if: always() && needs.decide.outputs.start == 'true'
    uses: osac-project/osac-ci/.github/workflows/e2e-pr-finish.yml@c9463f6a0f6e00459160434041d38d6b7e5ae5df  # osac-ci main (PR 56)
    permissions:
      contents: read
    with:
      sha: ${{ needs.decide.outputs.sha }}
      suites: ${{ needs.decide.outputs.suites }}
      suite-checks: ${{ needs.decide.outputs.suite-checks }}
      results: ${{ toJSON(needs) }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
