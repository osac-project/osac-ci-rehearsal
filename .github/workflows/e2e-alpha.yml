---
name: E2E Alpha Stub
# Started by the decision as a run of its own (workflow_dispatch); the name of the run is how its end is recognised.
run-name: "E2E suite · alpha · #${{ inputs.pr-number }} · ${{ inputs.sha }}"  # quoted: an unquoted " #" starts a YAML comment
on:
  workflow_dispatch:
    inputs:
      repo: {type: string, required: true}
      sha: {type: string, required: true}
      pr-number: {type: string, default: ""}
      fork-pr-author: {type: string, default: ""}
      fork-pr-author-association: {type: string, default: ""}
      tier: {type: string, default: ""}
  workflow_call:
    inputs:
      repo: {type: string, required: true}
      sha: {type: string, required: true}
      pr-number: {type: string, default: ""}
      fork-pr-author: {type: string, default: ""}
      fork-pr-author-association: {type: string, default: ""}
      tier: {type: string, default: ""}
permissions:
  contents: read
jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - env:
          AUTHOR: ${{ inputs.fork-pr-author }}
          ASSOC: ${{ inputs.fork-pr-author-association }}
          TIER: ${{ inputs.tier }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "tier='${TIER}'"
          echo "the stub suite alpha runs for ${{ inputs.sha }} of ${{ inputs.repo }} (PR ${{ inputs.pr-number }}); fork author='${AUTHOR}' association='${ASSOC}'"
          if [ "${EVENT}" = merge_group ]; then sleep 180; elif [ -e alpha/long ]; then sleep 300; else sleep 40; fi
          # a failure to retest: with alpha/failonce in the commit, the first attempt of a run fails and a re-run passes
          if [ -e alpha/failonce ] && [ "${{ github.run_attempt }}" = 1 ]; then echo "alpha/failonce exists: the first attempt fails on purpose"; exit 1; fi
