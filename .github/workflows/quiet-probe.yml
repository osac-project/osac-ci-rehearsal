name: quiet probe
on:
  pull_request:
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Edit the control comment with the workflow's own token
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          cid=$(gh api "repos/${REPO}/issues/${PR}/comments" --jq '.[]|select(.body|contains("osac-ci:manual-run"))|.id' | head -1)
          echo "comment id: ${cid}"
          body=$(gh api "repos/${REPO}/issues/comments/${cid}" --jq .body)
          out=$(gh api -X PATCH "repos/${REPO}/issues/comments/${cid}" -f body="${body}"$'\n<!-- probe -->' -i 2>&1 | head -1)
          echo "PATCH answered: ${out}"
