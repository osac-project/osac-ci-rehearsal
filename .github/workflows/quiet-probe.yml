name: quiet probe
on:
  pull_request:
permissions:
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Edit the control comment with the workflow's own token
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          cid=$(gh api "repos/${REPO}/issues/${PR}/comments" --jq '.[]|select(.body|contains("osac-ci:manual-run"))|.id' | head -1)
          echo "comment id: ${cid}"
          echo "GET answered: $(gh api -i "repos/${REPO}/issues/comments/${cid}" 2>&1 | head -1)"
          echo "PATCH answered: $(gh api -i -X PATCH "repos/${REPO}/issues/comments/${cid}" -f body='probe (pull-requests write only)' 2>&1 | head -1)"
