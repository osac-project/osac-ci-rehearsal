---
name: E2E for the merge queue
on:
  merge_group:
permissions: {}
jobs:
  plan:
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-plan.yml@e27c170b083391ffaf0341f3e62db11ffa8b85aa  # suite-variants (test)
    permissions:
      contents: read
      actions: write

  alpha:
    needs: plan
    if: contains(needs.plan.outputs.suites, '"alpha"')
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-alpha.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}

  beta:
    needs: plan
    if: contains(needs.plan.outputs.suites, '"beta"')
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-beta.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}

  finish:
    needs: [plan, alpha, beta]
    if: always()
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-finish.yml@e27c170b083391ffaf0341f3e62db11ffa8b85aa  # suite-variants (test)
    permissions:
      contents: read
    with:
      sha: ${{ github.event.merge_group.head_sha }}
      results: ${{ toJSON(needs) }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
