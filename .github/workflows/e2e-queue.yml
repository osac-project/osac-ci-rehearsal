---
name: E2E for the merge queue
on:
  merge_group:
permissions: {}
jobs:
  plan:
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-plan.yml@67444718fd1cf7305d20f0bfcc393a7d8aa61505  # fail-fast (test)
    permissions:
      contents: read
      actions: write

  alpha:
    needs: plan
    if: contains(needs.plan.outputs.suites, '"alpha"')
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-alpha.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}

  beta:
    needs: plan
    if: contains(needs.plan.outputs.suites, '"beta"')
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-beta.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}

  # Stops the run as soon as a suite fails, so the entry is told at once (see osac-ci's docs/CALLERS.md).
  fail-fast:
    needs: plan
    if: needs.plan.outputs.suites != '[]'
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-fail-fast.yml@67444718fd1cf7305d20f0bfcc393a7d8aa61505  # fail-fast (test)
    permissions:
      actions: write
    with:
      suites: ${{ needs.plan.outputs.suites }}

  finish:
    needs: [plan, alpha, beta]
    if: always()
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-finish.yml@67444718fd1cf7305d20f0bfcc393a7d8aa61505  # fail-fast (test)
    permissions:
      contents: read
    with:
      sha: ${{ github.event.merge_group.head_sha }}
      results: ${{ toJSON(needs) }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
