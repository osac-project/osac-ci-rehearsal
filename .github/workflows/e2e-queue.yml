---
name: E2E for the merge queue
on:
  merge_group:
permissions: {}
jobs:
  plan:
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-plan.yml@17a98e41645ede0ecdcd6a62b238e8b18306c19d  # osac-ci service-noise (temporary)
    permissions:
      contents: read
      actions: write

  alpha:
    needs: plan
    if: contains(needs.plan.outputs.suites, '"alpha"')
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-alpha.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}

  beta:
    needs: plan
    if: contains(needs.plan.outputs.suites, '"beta"')
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-beta.yml
    with:
      repo: ${{ github.repository }}
      sha: ${{ github.event.merge_group.head_sha }}

  # One job that looks after the entry: watches the suites and the other required checks of the commit, writes E2E at once
  # on the first failure and stops everything that still runs (see osac-ci's docs/CALLERS.md).
  result:
    needs: plan
    if: always()
    uses: osac-project/osac-ci/.github/workflows/e2e-queue-result.yml@17a98e41645ede0ecdcd6a62b238e8b18306c19d  # osac-ci service-noise (temporary)
    permissions:
      actions: write
      contents: read
    with:
      sha: ${{ github.event.merge_group.head_sha }}
      branch: ${{ github.event.merge_group.base_ref }}
      plan-result: ${{ needs.plan.result }}
      suites: ${{ needs.plan.outputs.suites }}
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
