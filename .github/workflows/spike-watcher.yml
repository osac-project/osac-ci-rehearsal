---
# SPIKE (delete after): what a workflow_run of a dispatched run carries.
name: Spike watcher
on:  # zizmor: ignore[dangerous-triggers] -- spike, prints data only
  workflow_run:
    workflows: ["Spike suite"]
    types: [requested, completed]
permissions: {}
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT_JSON: ${{ toJSON(github.event.workflow_run) }}
          ACTION: ${{ github.event.action }}
        run: |
          echo "action=${ACTION}"
          echo "${EVENT_JSON}" | jq '{id,name,display_title,head_sha,head_branch,event,status,conclusion,run_attempt,path,actor:.actor.login,triggering_actor:.triggering_actor.login,pull_requests}'
