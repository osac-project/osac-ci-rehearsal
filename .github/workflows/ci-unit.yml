---
# A cheap job of the pull request that the controller (osac-ci, as the OSAC CI app) starts as a run of its own when a pull
# request opens or gets a commit, and whose line (CI / unit) it writes; the name of the run is how its end is recognised.
name: Autopilot / CI / Unit
run-name: "CI job · unit · #${{ inputs.pr-number }} · ${{ inputs.sha }}"  # quoted: an unquoted " #" starts a YAML comment

on:
  workflow_dispatch:  # a pull request: started by the controller
    inputs:
      repo: {type: string, required: true}
      sha: {type: string, required: true}
      pr-number: {type: string, required: true}
      fork-pr-author: {type: string, default: ""}
      fork-pr-author-association: {type: string, default: ""}
  workflow_call:  # a merge queue entry: a job of the entry's run (the commit is the event's, not an input anyone gave)
    inputs:
      repo: {type: string, required: true}
      sha: {type: string, required: true}
      pr-number: {type: string, default: ""}
      fork-pr-author: {type: string, default: ""}
      fork-pr-author-association: {type: string, default: ""}

permissions: {}

# A newer commit of the pull request stops the run of the old one (a queue entry has no pull request number: its commit)
concurrency:
  group: ci-unit-${{ inputs.pr-number || inputs.sha }}
  cancel-in-progress: true

jobs:
  verify:
    if: inputs.pr-number != ''  # a pull request's inputs are checked against it; a queue entry's are the event's
    uses: osac-project/osac-ci/.github/workflows/suite-inputs.yml@705213249202203637ca2f0d57205963921a8f69  # osac-ci branch autopilot-cheap-stage (unreleased)
    permissions:
      contents: read
      pull-requests: read
    with:
      repo: ${{ inputs.repo }}
      sha: ${{ inputs.sha }}
      pr-number: ${{ inputs.pr-number }}
  unit:
    name: unit
    needs: verify
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - env:
          ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
        run: |
          sleep 10
          # a failure in the merge queue only, to try stopping a queue entry for it (the file ci-queue-fail)
          if [ "${EVENT}" = merge_group ] && [ -e ci-queue-fail ]; then echo "ci-queue-fail exists: unit fails in the queue"; exit 1; fi
          # a failure to retest: with demo/fail-unit in the commit, the first attempt of a run fails and a re-run passes
          if [ -e demo/fail-unit ] && [ "${ATTEMPT}" = 1 ]; then echo "demo/fail-unit exists: the first attempt fails on purpose"; exit 1; fi
