name: rerun probe
on:
  pull_request:
permissions: {}
jobs:
  fails-fast:
    runs-on: ubuntu-latest
    steps:
      - run: echo "this job fails at once"; exit 1
  ok-fast:
    runs-on: ubuntu-latest
    steps:
      - run: echo "this one passes at once"
  slow:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 300
