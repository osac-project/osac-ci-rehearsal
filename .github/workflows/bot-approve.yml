---
name: Bot approval
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      number:
        description: One pull request number (empty means every open dependency update)
        required: false
        default: ""
permissions: {}
concurrency:
  group: bot-approve
  cancel-in-progress: false
jobs:
  sweep:
    uses: osac-project/osac-ci/.github/workflows/bot-sweep.yml@2a5e838382ec18217a0161183f0b777dc5d3eead  # bot-sweep-app-token
    permissions:
      contents: read
      pull-requests: read
    with:
      number: ${{ inputs.number }}
      konflux-prep: true
      konflux-login: eliorerz  # rehearsal: my own pull requests stand in for Konflux's
    secrets:
      OSAC_CI_APP_PRIVATE_KEY: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
