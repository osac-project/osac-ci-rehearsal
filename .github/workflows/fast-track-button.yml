---
# Fast track, way 3: a button on a check run. Every commit of a pull request gets a finished check run of the OSAC CI app
# with one action button; GitHub shows it on the check's page (Checks tab) and tells the app when it is pressed
# (check_run requested_action), which runs the job below as the person who pressed it.
name: Fast track · button
run-name: Fast track #${{ github.event.pull_request.number || '' }} · button ${{ github.event.action }}

on:  # zizmor: ignore[dangerous-triggers] -- nothing of the pull request is checked out
  pull_request_target:
    types: [opened, reopened, synchronize]
  check_run:
    types: [requested_action]

permissions: {}

jobs:
  offer:
    name: Fast track offer
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Token of the OSAC CI app
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: "4966101"
          private-key: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: write
          permission-issues: write
          permission-contents: read
      - name: Write the check run with the button
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n --arg sha "$SHA" '{name: "Fast track (button)", head_sha: $sha, status: "completed", conclusion: "neutral",
            output: {title: "Fast track is available to people who may use it",
                     summary: "Press **Skip E2E** to fast-track this commit. The job checks that you may, and a new commit takes it back."},
            actions: [{label: "Skip E2E", description: "Fast-track this commit", identifier: "skip_e2e"}]}' \
            | gh api -X POST "repos/$REPO/check-runs" --input - --jq '"written: " + .html_url'

  pressed:
    name: Fast track pressed
    if: github.event_name == 'check_run' && github.event.check_run.name == 'Fast track (button)' && github.event.requested_action.identifier == 'skip_e2e' && github.event.check_run.app.slug == 'osac-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Token of the OSAC CI app
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: "4966101"
          private-key: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: write
          permission-issues: write
          permission-contents: read
      - name: Find the pull request
        id: pull
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.check_run.head_sha }}
        run: echo "number=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number')" >> "$GITHUB_OUTPUT"
      - name: Check who pressed it and write the line
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pull.outputs.number }}
          ACTOR: ${{ github.event.sender.login }}
          REASON: Pressed the Skip E2E button of the check
          CHECK: Fast track (button) · skipped
          VIA: the button
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALLOW_AUTHOR: "true"  # rehearsal only
        run: .github/scripts/fast-track.sh
