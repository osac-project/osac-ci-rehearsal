name: S3 composite action of the pull request
description: Runs as an action of the job, so it is given the runtime credentials of the job.
runs:
  using: composite
  steps:
    - name: Names of the runtime variables an action sees
      shell: bash
      run: env | cut -d= -f1 | grep -E '^ACTIONS_' | sort
    - name: Make something to cache
      shell: bash
      run: |
        mkdir -p s3-cache
        echo "written by the code of a pull request" > s3-cache/x
    - name: Save it in the cache of the repository
      uses: actions/cache/save@v4
      with:
        path: s3-cache
        key: s3-poison-${{ github.run_id }}
